<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Restaurant Image - Foodo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="shortcut icon" href="icons/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800,900" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            background: #f8f9fa;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .upload-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }

        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin: 20px 0;
        }

        .upload-area:hover {
            border-color: #ffc107;
            background: #fff9e6;
        }

        .upload-area.dragover {
            border-color: #ffc107;
            background: #fff9e6;
        }

        .preview-container {
            display: none;
            margin: 20px 0;
        }

        .preview-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .file-input {
            display: none;
        }

        .upload-icon {
            font-size: 48px;
            color: #ffc107;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="upload-card">
        <h3 class="text-center mb-2">Upload Restaurant Image</h3>
        <p class="text-center text-muted mb-4">Add a photo to showcase your restaurant</p>

        <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">📸</div>
            <h5>Click to upload or drag and drop</h5>
            <p class="text-muted mb-0">PNG, JPG or JPEG (MAX. 5MB)</p>
        </div>

        <input type="file" id="fileInput" class="file-input" accept="image/png,image/jpeg,image/jpg">

        <div class="preview-container" id="previewContainer">
            <h6 class="mb-3">Preview:</h6>
            <img id="previewImage" class="preview-image" alt="Restaurant preview">
            <button class="btn btn-sm btn-outline-danger mt-2" onclick="clearImage()">Remove Image</button>
        </div>

        <div class="alert alert-danger" id="error-alert" style="display:none;"></div>

        <div class="d-flex justify-content-between mt-4">
            <button class="btn btn-outline-secondary" onclick="skipUpload()">Skip for Now</button>
            <button class="btn btn-primary px-4" id="submit-btn" onclick="uploadImage()" disabled>Continue</button>
        </div>
    </div>

    <script src="js/Authentication.js"></script>
    <script src="js/config.js"></script>
    <script>
        let selectedFile = null;
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const submitBtn = document.getElementById('submit-btn');
        const errorAlert = document.getElementById('error-alert');

        // File input change handler
        fileInput.addEventListener('change', handleFileSelect);

        // Drag and drop handlers
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');

            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFile(file);
            } else {
                showError('Please select a valid image file');
            }
        });

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        }

        function handleFile(file) {
            // Validate file type
            if (!file.type.startsWith('image/')) {
                showError('Please select an image file');
                return;
            }

            // Validate file size (5MB max)
            if (file.size > 5 * 1024 * 1024) {
                showError('File size must be less than 5MB');
                return;
            }

            selectedFile = file;

            // Show preview
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewContainer.style.display = 'block';
                uploadArea.style.display = 'none';
                submitBtn.disabled = false;
                errorAlert.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }

        function clearImage() {
            selectedFile = null;
            fileInput.value = '';
            previewContainer.style.display = 'none';
            uploadArea.style.display = 'block';
            submitBtn.disabled = true;
        }

        function showError(message) {
            errorAlert.textContent = message;
            errorAlert.style.display = 'block';
        }

        async function uploadImage() {
            const userId = sessionStorage.getItem('tempUserId');

            if (!userId) {
                showError('User ID missing. Please register again.');
                setTimeout(() => {
                    window.location.href = 'Register.html';
                }, 2000);
                return;
            }

            if (!selectedFile) {
                showError('Please select an image');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Uploading...';
            errorAlert.style.display = 'none';

            try {
                const formData = new FormData();
                formData.append('file', selectedFile);
                formData.append('MerchantId', userId);

                const response = await fetch(`${API_CONFIG.BASE_URL}/api/Photos/add-merchant-photo`, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    sessionStorage.removeItem('tempUserId');
                    alert('Setup complete! Please login to continue.');
                    window.location.href = 'Login.html';
                } else {
                    const errorText = await response.text();
                    showError(errorText || 'Failed to upload image');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Continue';
                }
            } catch (error) {
                console.error('Upload error:', error);
                showError('Network error. Please try again.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Continue';
            }
        }

        function skipUpload() {
            const userId = sessionStorage.getItem('tempUserId');

            if (userId) {
                sessionStorage.removeItem('tempUserId');
            }

            alert('You can add a restaurant image later from your profile.');
            window.location.href = 'Login.html';
        }
    </script>
</body>

</html>
