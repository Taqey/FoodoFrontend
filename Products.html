<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foods - Foodo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="shortcut icon" href="icons/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800,900" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/ionicons/4.5.6/css/ionicons.min.css">
    <link rel="stylesheet" href="css/dropdown.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/Authentication.js"></script>
    <script src="js/ProfileService.js"></script>
    <script src="js/CustomerService.js"></script>
    <style>
        .product-card {
            transition: transform 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .cart-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #ffc107;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            z-index: 1000;
        }

        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: red;
            color: white;
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 12px;
        }
    </style>
    <style>
        .cart-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background-color: #ffc107;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            z-index: 9999;
            transition: transform 0.2s;
        }

        .cart-btn:hover {
            transform: scale(1.1);
        }

        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: red;
            color: white;
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: bold;
        }

        .product-card img {
            transition: transform 0.3s;
        }

        .product-card:hover img {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="container-fluid d-flex justify-content-between align-items-center m-0">
            <a href="index.html" class="d-flex align-items-center text-decoration-none p-1">
                <img src="icons/Logo.png" alt="Logo" height="60">
            </a>

            <nav class="d-none d-md-flex gap-4">
                <a href="index.html" class="text-decoration-none text-dark">Home</a>
                <a href="Shops.html" class="text-decoration-none text-dark">Restaurants</a>
                <a href="Products.html" class="text-decoration-none text-dark fw-bold">Foods</a>
            </nav>

            <div class="d-flex align-items-center gap-2">
                <!-- Cart Icon in Header -->
                <div class="position-relative" onclick="openCart()" style="cursor: pointer;">
                    <i class="ion-ios-cart" style="font-size: 28px; color: #ffc107;"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                        id="headerCartCount" style="font-size: 10px;">0</span>
                </div>

                <div id="authButtons">
                    <a href="Login.html" class="btn btn-primary">Login</a>
                    <a href="Register.html" class="btn btn-outline-primary">Register</a>
                </div>

                <div class="btn-group d-none" id="drop">
                    <a href="#" class="btn-img img dropdown-toggle rounded-circle" data-bs-toggle="dropdown"
                        aria-expanded="false"
                        style="background-image: url('images/user.png'); width:50px; height:50px;">
                    </a>

                    <div class="dropdown-menu dropdown-menu-end mt-2">
                        <a class="dropdown-item d-flex align-items-center" href="CustomerDashboard.html">
                            <div class="icon d-flex align-items-center justify-content-center me-3">
                                <span class="ion-ios-person"></span>
                            </div>
                            My Profile
                        </a>
                        <a class="dropdown-item d-flex align-items-center" href="CustomerDashboard.html#orders">
                            <div class="icon d-flex align-items-center justify-content-center me-3">
                                <span class="ion-ios-cart"></span>
                            </div>
                            My Orders
                        </a>
                        <a class="dropdown-item d-flex align-items-center" id="logout" href="#">
                            <div class="icon d-flex align-items-center justify-content-center me-3">
                                <span class="ion-ios-power"></span>
                            </div>
                            Log Out
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="container py-5">
        <!-- Filter Controls Section -->
        <div class="mb-4">
            <div class="row g-3 align-items-center">
                <div class="col-12 col-md-3">
                    <h2 id="pageTitle" class="mb-0">All Products</h2>
                </div>

                <!-- Category Filter -->
                <div class="col-6 col-md-3">
                    <select id="categoryFilter" class="form-select">
                        <option value="">All Categories</option>
                        <!-- Populated dynamically -->
                    </select>
                </div>

                <!-- Sort Field -->
                <div class="col-6 col-md-2">
                    <select id="sortField" class="form-select">
                        <option value="">Sort By</option>
                        <option value="name">Name</option>
                        <option value="price">Price</option>
                    </select>
                </div>

                <!-- Sort Direction -->
                <div class="col-6 col-md-2">
                    <select id="sortDirection" class="form-select">
                        <option value="">Direction</option>
                        <option value="asc">Ascending</option>
                        <option value="desc">Descending</option>
                    </select>
                </div>

                <!-- Page Size -->
                <div class="col-6 col-md-2">
                    <select id="pageSize" class="form-select">
                        <option value="10">10 / page</option>
                        <option value="20">20 / page</option>
                        <option value="50">50 / page</option>
                        <option value="100">100 / page</option>
                    </select>
                </div>
            </div>

            <!-- Active Filters Display -->
            <div id="activeFilters" class="mt-3 d-flex gap-2 flex-wrap">
                <!-- Dynamically rendered filter chips -->
            </div>
        </div>

        <!-- Products Grid -->
        <div id="productsContainer" class="row">
        </div>

        <!-- Pagination Controls -->
        <div class="d-flex justify-content-between align-items-center mt-4" id="paginationControls">
            <button class="btn btn-outline-secondary" id="prevBtn" onclick="changePage(-1)">
                Previous
            </button>
            <div class="d-flex align-items-center gap-3">
                <span id="pageInfo">Page 1</span>
                <span class="text-muted small" id="totalItemsInfo"></span>
            </div>
            <button class="btn btn-outline-secondary" id="nextBtn" onclick="changePage(1)">
                Next
            </button>
        </div>
    </div>

    <div class="cart-btn" onclick="openCart()">
        <i class="ion-ios-cart"></i>
        <span class="cart-badge" id="cartCount">0</span>
    </div>

    <div class="modal fade" id="cartModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Your Cart</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="cartItems">
                    </div>
                    <div class="d-flex justify-content-between mt-3 fw-bold">
                        <span>Total:</span>
                        <span id="cartTotal">$0.00</span>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-danger" onclick="clearCart()">Clear</button>
                    <button type="button" class="btn btn-primary" onclick="checkout()">Checkout</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Checkout Confirmation Modal -->
    <div class="modal fade" id="checkoutConfirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirm Delivery Address</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="checkoutAddressContent">
                        <p class="text-center"><span class="spinner-border spinner-border-sm"></span> Loading address...
                        </p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-warning" id="updateAddressBtn" onclick="goToProfile()">No,
                        Update Address</button>
                    <button type="button" class="btn btn-primary" id="confirmOrderBtn"
                        onclick="confirmAndPlaceOrder()">Yes, Place Order</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Unified filter state object
        const productFilters = {
            pageNumber: 1,
            pageSize: 10,  // Default matches UI
            categoryId: null,
            restaurantId: null,
            orderBy: null,
            direction: null
        };

        let cart = [];
        let cartModal;
        let checkoutConfirmModal;

        // FoodCategory enum values (string name => integer value)
        const FOOD_CATEGORIES = {
            "Burger": 1, "Pizza": 2, "Pasta": 3, "Sandwich": 4, "Grill": 5, "FriedChicken": 6,
            "Seafood": 7, "Salad": 8, "Soup": 9, "Dessert": 10, "IceCream": 11, "Juice": 12,
            "Coffee": 13, "Beverage": 14, "Appetizer": 15, "MainCourse": 16, "SideDish": 17,
            "Shawarma": 18, "Kebab": 19, "Sushi": 20, "Tacos": 21, "Noodles": 22, "RiceDishes": 23,
            "Pastry": 24, "Breakfast": 25
        };

        document.addEventListener('DOMContentLoaded', () => {
            Authentication.updateHeader();

            // Initialize modals
            cartModal = new bootstrap.Modal(document.getElementById('cartModal'));
            checkoutConfirmModal = new bootstrap.Modal(document.getElementById('checkoutConfirmModal'));

            loadCart();
            initializeFilterDropdown();
            initializeFiltersFromURL();

            // Initial load
            loadProducts();

            // Filter dropdown change listener
            document.getElementById('categoryFilter').addEventListener('change', (e) => {
                const value = e.target.value;
                if (value) {
                    applyFilter('categoryId', FOOD_CATEGORIES[value]);
                } else {
                    clearFilter('categoryId');
                }
            });

            // Sorting listeners
            document.getElementById('sortField').addEventListener('change', (e) => {
                applyFilter('orderBy', e.target.value || null);
            });

            document.getElementById('sortDirection').addEventListener('change', (e) => {
                applyFilter('direction', e.target.value || null);
            });

            document.getElementById('pageSize').addEventListener('change', (e) => {
                productFilters.pageSize = parseInt(e.target.value);
                productFilters.pageNumber = 1;
                updateURL();
                loadProducts();
            });

            // Handle browser back/forward buttons
            window.addEventListener('popstate', () => {
                initializeFiltersFromURL();
                loadProducts();
            });
        });

        function initializeFilterDropdown() {
            const filter = document.getElementById('categoryFilter');
            Object.keys(FOOD_CATEGORIES).sort().forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                filter.appendChild(option);
            });
        }

        function initializeFiltersFromURL() {
            const urlParams = new URLSearchParams(window.location.search);

            // Reset to defaults first
            productFilters.pageNumber = 1;
            productFilters.categoryId = null;
            productFilters.restaurantId = null;
            productFilters.orderBy = null;
            productFilters.direction = null;
            productFilters.pageSize = 10;

            if (urlParams.has('category')) {
                const categoryName = urlParams.get('category');
                productFilters.categoryId = FOOD_CATEGORIES[categoryName] || null;
                // Sync dropdown if exists
                if (productFilters.categoryId) {
                    document.getElementById('categoryFilter').value = categoryName;
                }
            }

            if (urlParams.has('restaurantId')) {
                productFilters.restaurantId = urlParams.get('restaurantId');
                document.getElementById('pageTitle').textContent = 'Restaurant Menu';
            } else {
                document.getElementById('pageTitle').textContent = 'All Products';
            }

            if (urlParams.has('page')) {
                productFilters.pageNumber = parseInt(urlParams.get('page')) || 1;
            }

            if (urlParams.has('pageSize')) {
                const size = parseInt(urlParams.get('pageSize'));
                if ([10, 20, 50, 100].includes(size)) {
                    productFilters.pageSize = size;
                    document.getElementById('pageSize').value = size;
                }
            }

            if (urlParams.has('orderBy')) {
                productFilters.orderBy = urlParams.get('orderBy');
                document.getElementById('sortField').value = productFilters.orderBy;
            }

            if (urlParams.has('direction')) {
                productFilters.direction = urlParams.get('direction');
                document.getElementById('sortDirection').value = productFilters.direction;
            }
        }

        // Update URL to reflect current filters
        function updateURL() {
            const params = new URLSearchParams();

            if (productFilters.categoryId) {
                const categoryName = Object.keys(FOOD_CATEGORIES)
                    .find(k => FOOD_CATEGORIES[k] === productFilters.categoryId);
                if (categoryName) params.set('category', categoryName);
            }

            if (productFilters.restaurantId) {
                params.set('restaurantId', productFilters.restaurantId);
            }

            if (productFilters.pageNumber > 1) {
                params.set('page', productFilters.pageNumber);
            }

            if (productFilters.pageSize !== 10) {
                params.set('pageSize', productFilters.pageSize);
            }

            if (productFilters.orderBy) {
                params.set('orderBy', productFilters.orderBy);
            }

            if (productFilters.direction) {
                params.set('direction', productFilters.direction);
            }

            const newURL = params.toString()
                ? `${window.location.pathname}?${params.toString()}`
                : window.location.pathname;

            history.pushState(null, '', newURL);
        }

        // Single unified load function
        async function loadProducts() {
            // Use unified service method with unified state
            const result = await CustomerService.getProducts(productFilters);

            renderProducts(result.items);
            renderActiveFilters();
            updatePaginationUI(result);

            // Smooth scroll to top of products if not on page 1
            if (productFilters.pageNumber > 1) {
                document.getElementById('pageTitle').scrollIntoView({ behavior: 'smooth' });
            }
        }

        // Apply filter and reload
        function applyFilter(filterName, value) {
            productFilters[filterName] = value;
            productFilters.pageNumber = 1; // Reset to first page
            updateURL();
            loadProducts();
        }

        // Clear specific filter
        function clearFilter(filterName) {
            productFilters[filterName] = null;
            productFilters.pageNumber = 1;

            if (filterName === 'categoryId') {
                document.getElementById('categoryFilter').value = '';
            }

            if (filterName === 'restaurantId') {
                document.getElementById('pageTitle').textContent = 'All Products';
            }

            if (filterName === 'orderBy') {
                document.getElementById('sortField').value = '';
            }

            if (filterName === 'direction') {
                document.getElementById('sortDirection').value = '';
            }

            updateURL();
            loadProducts();
        }

        // Render active filter chips
        function renderActiveFilters() {
            const container = document.getElementById('activeFilters');
            container.innerHTML = '';

            // Category filter chip
            if (productFilters.categoryId) {
                const categoryName = Object.keys(FOOD_CATEGORIES)
                    .find(k => FOOD_CATEGORIES[k] === productFilters.categoryId);

                const chip = createFilterChip('Category', categoryName, () => {
                    clearFilter('categoryId');
                });
                container.appendChild(chip);
            }

            // Restaurant filter chip
            if (productFilters.restaurantId) {
                const chip = createFilterChip('Restaurant', 'View Menu', () => {
                    clearFilter('restaurantId');
                });
                container.appendChild(chip);
            }

            // Order By chip
            if (productFilters.orderBy) {
                const label = productFilters.orderBy === 'name' ? 'Name' : 'Price';
                const chip = createFilterChip('Sort', label, () => {
                    clearFilter('orderBy');
                });
                container.appendChild(chip);
            }
        }

        function createFilterChip(label, value, onRemove) {
            const chip = document.createElement('span');
            chip.className = 'badge bg-primary d-flex align-items-center gap-2';
            chip.style.fontSize = '0.9rem';
            chip.innerHTML = `
                ${label}: ${value}
                <button class="btn-close btn-close-white btn-sm" 
                    style="font-size: 0.6rem;" 
                    onclick="event.stopPropagation()"></button>
            `;
            chip.querySelector('.btn-close').addEventListener('click', onRemove);
            return chip;
        }

        function renderProducts(products) {
            const container = document.getElementById('productsContainer');
            container.innerHTML = '';

            if (products.length === 0) {
                container.innerHTML = '<div class="col-12 text-center py-5"><p class="text-muted fs-5">No products found matching your criteria.</p></div>';
                document.getElementById('paginationControls').style.display = 'none';
                return;
            }

            document.getElementById('paginationControls').style.display = 'flex';

            products.forEach(p => {
                const col = document.createElement('div');
                col.className = 'col-md-4 col-lg-3 mb-4';

                //Get main image or first image
                const mainImage = p.urls?.find(u => u.isMain)?.url || p.urls?.[0]?.url || '';

                const imageHtml = mainImage
                    ? `<img src="${mainImage}" class="card-img-top" style="height: 200px; object-fit: contain;" alt="${p.productName}">`
                    : `<div class="card-img-top d-flex align-items-center justify-content-center bg-light" style="height: 200px;">
                           <i class="ion-ios-restaurant" style="font-size: 3rem; color: #ddd;"></i>
                       </div>`;

                const attributesHtml = p.attributes ? p.attributes.map(a =>
                    `<small class="text-muted d-block">${a.name}: ${a.value}</small>`
                ).join('') : '';

                col.innerHTML = `
                    <div class="card product-card h-100" style="cursor: pointer;" onclick="window.location.href='ProductDetails.html?id=${p.productId}'">
                        ${imageHtml}
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">${p.productName}</h5>
                            <p class="card-text text-muted small flex-grow-1">${p.productDescription || ''}</p>
                            <div class="mb-2">${attributesHtml}</div>
                            <div class="d-flex justify-content-between align-items-center mt-auto">
                                <span class="fw-bold">$${p.price}</span>
                                <button class="btn btn-sm btn-outline-primary" onclick="event.stopPropagation(); addToCart(${p.productId}, '${p.productName}', ${p.price}, '${p.merchantId || ''}')">Add</button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(col);
            });
        }

        function changePage(delta) {
            const newPage = productFilters.pageNumber + delta;
            // Check bounds will be handled by UI state update
            if (newPage > 0) {
                productFilters.pageNumber = newPage;
                updateURL();
                loadProducts();
            }
        }

        function updatePaginationUI(result) {
            // Handle result structure differences just in case
            const totalItems = result.totalItems || 0;
            const totalPages = result.totalPages || 1;
            const currentPage = productFilters.pageNumber;

            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('totalItemsInfo').textContent = `(${totalItems} items)`;

            // Disable prev/next buttons appropriately
            document.getElementById('prevBtn').disabled = currentPage <= 1;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages;
        }

        // --- Cart Functions (Unchanged) ---

        function loadCart() {
            const stored = localStorage.getItem('foodo_cart');
            if (stored) cart = JSON.parse(stored);
            updateCartUI();
        }

        function saveCart() {
            localStorage.setItem('foodo_cart', JSON.stringify(cart));
            updateCartUI();
        }

        function addToCart(id, name, price, merchantId) {
            price = Number(price);
            // Strict restaurant restriction - do not allow mixed carts
            if (cart.length > 0 && cart[0].merchantId !== merchantId) {
                alert('⚠️ Your cart contains items from another restaurant.\n\nPlease complete your current order or clear your cart before adding items from a different restaurant.');
                return; // Prevent adding
            }

            const existing = cart.find(i => i.id === id);
            if (existing) {
                existing.quantity++;
            } else {
                cart.push({ id, name, price, merchantId, quantity: 1 });
            }
            saveCart();
            // Show toast or small feedback could be good here
        }

        function updateCartUI() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').textContent = count;
            // Update header cart count as well
            const headerCount = document.getElementById('headerCartCount');
            if (headerCount) {
                headerCount.textContent = count;
                headerCount.style.display = count > 0 ? 'inline-block' : 'none';
            }
        }

        window.openCart = function () {
            if (!cartModal) {
                const el = document.getElementById('cartModal');
                if (el) cartModal = new bootstrap.Modal(el);
                else return;
            }
            const container = document.getElementById('cartItems');
            container.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                container.innerHTML = '<p class=\"text-center\">Cart is empty.</p>';
            } else {
                cart.forEach(item => {
                    const price = Number(item.price);
                    const itemTotal = price * item.quantity;
                    total += itemTotal;
                    const div = document.createElement('div');
                    div.className = 'd-flex justify-content-between align-items-center mb-3 border-bottom pb-2';
                    div.innerHTML = `
                        <div class=\"flex-grow-1\">
                            <div class=\"fw-bold\">${item.name}</div>
                            <small class=\"text-muted\">$${price.toFixed(2)} each</small>
                        </div>
                        <div class=\"d-flex align-items-center gap-2\">
                            <div class=\"btn-group\" role=\"group\">
                                <button class=\"btn btn-sm btn-outline-secondary\" onclick=\"updateQuantity(${item.id}, -1)\">−</button>
                                <button class=\"btn btn-sm btn-outline-secondary\" disabled style=\"min-width: 40px;\">${item.quantity}</button>
                                <button class=\"btn btn-sm btn-outline-secondary\" onclick=\"updateQuantity(${item.id}, 1)\">+</button>
                            </div>
                            <span class=\"fw-bold\" style=\"min-width: 60px; text-align: right;\">$${itemTotal.toFixed(2)}</span>
                            <button class=\"btn btn-sm btn-outline-danger\" onclick=\"removeFromCart(${item.id})\">&times;</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            }
            document.getElementById('cartTotal').textContent = '$' + total.toFixed(2);
            cartModal.show();
        }

        function updateQuantity(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    removeFromCart(id);
                } else {
                    saveCart();
                    openCart(); // Refresh cart display
                }
            }
        }

        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            saveCart();
            openCart();
        }

        function clearCart() {
            cart = [];
            saveCart();
            openCart();
        }

        async function checkout() {
            if (cart.length === 0) return;

            if (!Authentication.getToken()) {
                alert('Please login to place an order.');
                window.location.href = 'Login.html';
                return;
            }

            // Close cart modal and show confirmation modal
            cartModal.hide();

            // Show confirmation modal with loading state
            checkoutConfirmModal.show();
            document.getElementById('checkoutAddressContent').innerHTML =
                '\u003cp class=\"text-center\"\u003e\u003cspan class=\"spinner-border spinner-border-sm\"\u003e\u003c/span\u003e Loading address...\u003c/p\u003e';

            // Fetch user profile to get default address
            const profileResult = await ProfileService.getCustomerProfile();

            if (!profileResult.success) {
                document.getElementById('checkoutAddressContent').innerHTML =
                    `\u003cdiv class=\"alert alert-danger\"\u003eFailed to load address information. Please try again.\u003c/div\u003e`;
                document.getElementById('confirmOrderBtn').disabled = true;
                return;
            }

            const profile = profileResult.data;
            const defaultAddress = profile.adresses?.find(addr => addr.isDefault);

            if (!defaultAddress) {
                document.getElementById('checkoutAddressContent').innerHTML = `
                    \u003cdiv class=\"alert alert-warning\"\u003e
                        \u003ch6\u003eNo Default Address Set\u003c/h6\u003e
                        \u003cp class=\"mb-0\"\u003eYou need to set a default address before placing an order. Please go to your profile and add a default address.\u003c/p\u003e
                    \u003c/div\u003e
                `;
                document.getElementById('confirmOrderBtn').disabled = true;
                document.getElementById('updateAddressBtn').textContent = 'Go to Profile';
                return;
            }

            // Display default address and ask for confirmation
            document.getElementById('checkoutAddressContent').innerHTML = `
                \u003cdiv\u003e
                    \u003ch6\u003eDo you want to use your default address for delivery?\u003c/h6\u003e
                    \u003cdiv class=\"card p-3 mt-3 bg-light\"\u003e
                        \u003cp class=\"mb-1\"\u003e\u003cstrong\u003e${defaultAddress.streetAddress}\u003c/strong\u003e\u003c/p\u003e
                        \u003cp class=\"mb-1\"\u003e${defaultAddress.city}, ${defaultAddress.state} ${defaultAddress.postalCode}\u003c/p\u003e
                        \u003cp class=\"mb-0\"\u003e${defaultAddress.country}\u003c/p\u003e
                    \u003c/div\u003e
                \u003c/div\u003e
            `;
            document.getElementById('confirmOrderBtn').disabled = false;
        }

        async function confirmAndPlaceOrder() {
            // Map cart items to the format expected by the backend
            const items = cart.map(i => ({
                ItemId: i.id,
                ItemName: i.name,
                Quantity: i.quantity,
                Price: i.price
            }));

            const orderData = {
                Items: items
            };

            const result = await CustomerService.placeOrder(orderData);
            if (result.success) {
                alert('Order placed successfully!');
                clearCart();
                checkoutConfirmModal.hide();
                window.location.href = 'CustomerDashboard.html#orders';
            } else {
                alert(result.message || 'Failed to place order.');
            }
        }

        function goToProfile() {
            // Store return flag in sessionStorage so we can redirect back after address update
            sessionStorage.setItem('returnToCheckout', 'true');
            window.location.href = 'CustomerDashboard.html#profile';
        }
    </script>
</body>

</html>
