<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foods - Foodo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="shortcut icon" href="icons/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800,900" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/ionicons/4.5.6/css/ionicons.min.css">
    <link rel="stylesheet" href="css/dropdown.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/Authentication.js"></script>
    <script src="js/CustomerService.js"></script>
    <style>
        .product-card {
            transition: transform 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .cart-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #ffc107;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            z-index: 1000;
        }

        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: red;
            color: white;
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="container-fluid d-flex justify-content-between align-items-center m-0">

            <a href="index.html" class="d-flex align-items-center text-decoration-none p-1">
                <img src="icons/Logo.png" alt="Logo" height="60">
            </a>

            <nav class="d-none d-md-flex gap-4">
                <a href="index.html" class="text-decoration-none text-dark">Home</a>
                <a href="Shops.html" class="text-decoration-none text-dark">Restaurants</a>
                <a href="Products.html" class="text-decoration-none text-dark fw-bold">Foods</a>
            </nav>

            <div class="d-flex align-items-center gap-2">

                <div id="authButtons">
                    <a href="Login.html" class="btn btn-primary">Login</a>
                    <a href="Register.html" class="btn btn-outline-primary">Register</a>
                </div>

                <div class="btn-group d-none" id="drop">
                    <a href="#" class="btn-img img dropdown-toggle rounded-circle" data-bs-toggle="dropdown"
                        aria-expanded="false"
                        style="background-image: url('images/user.png'); width:50px; height:50px;">
                    </a>

                    <div class="dropdown-menu dropdown-menu-end mt-2">
                        <a class="dropdown-item d-flex align-items-center" href="CustomerDashboard.html">
                            <div class="icon d-flex align-items-center justify-content-center me-3">
                                <span class="ion-ios-person"></span>
                            </div>
                            My Profile
                        </a>
                        <a class="dropdown-item d-flex align-items-center" href="CustomerDashboard.html#orders">
                            <div class="icon d-flex align-items-center justify-content-center me-3">
                                <span class="ion-ios-cart"></span>
                            </div>
                            My Orders
                        </a>
                        <a class="dropdown-item d-flex align-items-center" id="logout" href="#">
                            <div class="icon d-flex align-items-center justify-content-center me-3">
                                <span class="ion-ios-power"></span>
                            </div>
                            Log Out
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </header>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 id="pageTitle">Foods</h2>
            <div class="d-flex gap-2">
                <select id="categoryFilter" class="form-select" style="width: 200px;">
                    <option value="">All Categories</option>
                </select>
            </div>
        </div>

        <div id="productsContainer" class="row">
        </div>

        <div class="d-flex justify-content-center align-items-center mt-5 gap-3">
            <button class="btn btn-outline-secondary" onclick="changePage(-1)">Previous</button>
            <span id="pageInfo">Page 1</span>
            <button class="btn btn-outline-secondary" onclick="changePage(1)">Next</button>
        </div>
    </div>

    <div class="cart-btn" onclick="openCart()">
        <i class="ion-ios-cart"></i>
        <span class="cart-badge" id="cartCount">0</span>
    </div>

    <div class="modal fade" id="cartModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Your Cart</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="cartItems">
                    </div>
                    <div class="d-flex justify-content-between mt-3 fw-bold">
                        <span>Total:</span>
                        <span id="cartTotal">$0.00</span>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-danger" onclick="clearCart()">Clear</button>
                    <button type="button" class="btn btn-primary" onclick="checkout()">Checkout</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        const pageSize = 12;
        let currentCategory = '';
        let currentRestaurantId = null;
        let cart = [];
        let cartModal;

        const FOOD_CATEGORIES = [
            "Burger", "Pizza", "Pasta", "Sandwich", "Grill", "FriedChicken",
            "Seafood", "Salad", "Soup", "Dessert", "IceCream", "Juice",
            "Coffee", "Beverage", "Appetizer", "MainCourse", "SideDish",
            "Shawarma", "Kebab", "Sushi", "Tacos", "Noodles", "RiceDishes",
            "Pastry", "Breakfast"
        ];

        document.addEventListener('DOMContentLoaded', () => {
            Authentication.updateHeader();
            cartModal = new bootstrap.Modal(document.getElementById('cartModal'));
            loadCart();

            const filter = document.getElementById('categoryFilter');
            FOOD_CATEGORIES.sort().forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                filter.appendChild(option);
            });

            const urlParams = new URLSearchParams(window.location.search);
            const catParam = urlParams.get('category');
            const restParam = urlParams.get('restaurantId');

            if (restParam) {
                currentRestaurantId = restParam;
                document.getElementById('pageTitle').textContent = 'Restaurant Menu';
                filter.style.display = 'none';
            } else if (catParam) {
                currentCategory = catParam;
                filter.value = catParam;
            }

            filter.addEventListener('change', (e) => {
                currentCategory = e.target.value;
                currentPage = 1;
                loadProducts();
            });

            loadProducts();
        });

        async function loadProducts() {
            let result;
            if (currentRestaurantId) {
                result = await CustomerService.getAllProductsByRestaurant(currentRestaurantId, currentPage, pageSize);
            } else if (currentCategory) {
                result = await CustomerService.getAllProductsByCategory(currentCategory, currentPage, pageSize);
            } else {
                result = await CustomerService.getAllProducts(currentPage, pageSize);
            }

            const products = result.items || [];
            renderProducts(products);
            document.getElementById('pageInfo').textContent = `Page ${currentPage}`;
        }

        function renderProducts(products) {
            const container = document.getElementById('productsContainer');
            container.innerHTML = '';

            if (products.length === 0) {
                container.innerHTML = '<div class="col-12 text-center"><p>No products found.</p></div>';
                return;
            }

            products.forEach(p => {
                const col = document.createElement('div');
                col.className = 'col-md-4 col-lg-3 mb-4';

                const attributesHtml = p.attributes ? p.attributes.map(a =>
                    `<small class="text-muted d-block">${a.name}: ${a.value}</small>`
                ).join('') : '';

                col.innerHTML = `
                    <div class="card product-card h-100">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">${p.productName}</h5>
                            <p class="card-text text-muted small flex-grow-1">${p.productDescription || ''}</p>
                            <div class="mb-2">${attributesHtml}</div>
                            <div class="d-flex justify-content-between align-items-center mt-auto">
                                <span class="fw-bold">$${p.price}</span>
                                <button class="btn btn-sm btn-outline-primary" onclick="addToCart(${p.productId}, '${p.productName}', ${p.price}, '${p.merchantId || ''}')">Add</button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(col);
            });
        }

        function changePage(delta) {
            const newPage = currentPage + delta;
            if (newPage > 0) {
                currentPage = newPage;
                loadProducts();
            }
        }

        function loadCart() {
            const stored = localStorage.getItem('foodo_cart');
            if (stored) cart = JSON.parse(stored);
            updateCartUI();
        }

        function saveCart() {
            localStorage.setItem('foodo_cart', JSON.stringify(cart));
            updateCartUI();
        }

        function addToCart(id, name, price, merchantId) {
            if (cart.length > 0 && cart[0].merchantId !== merchantId) {
                if (!confirm('Your cart contains items from another restaurant. Clear cart to add this item?')) {
                    return;
                }
                cart = [];
            }

            const existing = cart.find(i => i.id === id);
            if (existing) {
                existing.quantity++;
            } else {
                cart.push({ id, name, price, merchantId, quantity: 1 });
            }
            saveCart();
        }

        function updateCartUI() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').textContent = count;
        }

        function openCart() {
            const container = document.getElementById('cartItems');
            container.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                container.innerHTML = '<p class="text-center">Cart is empty.</p>';
            } else {
                cart.forEach(item => {
                    const itemTotal = item.price * item.quantity;
                    total += itemTotal;
                    const div = document.createElement('div');
                    div.className = 'd-flex justify-content-between align-items-center mb-2 border-bottom pb-2';
                    div.innerHTML = `
                        <div>
                            <div>${item.name}</div>
                            <small class="text-muted">$${item.price} x ${item.quantity}</small>
                        </div>
                        <div>
                            <span class="fw-bold me-2">$${itemTotal.toFixed(2)}</span>
                            <button class="btn btn-sm btn-outline-danger" onclick="removeFromCart(${item.id})">&times;</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            }
            document.getElementById('cartTotal').textContent = '$' + total.toFixed(2);
            cartModal.show();
        }

        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            saveCart();
            openCart();
        }

        function clearCart() {
            cart = [];
            saveCart();
            openCart();
        }

        async function checkout() {
            if (cart.length === 0) return;

            if (!Authentication.getToken()) {
                alert('Please login to place an order.');
                window.location.href = 'Login.html';
                return;
            }

            const merchantId = cart[0].merchantId;
            const items = cart.map(i => ({ ProductId: i.id, Quantity: i.quantity }));

            const orderData = {
                RestaurantId: merchantId,
                Items: items
            };

            const result = await CustomerService.placeOrder(orderData);
            if (result.success) {
                alert('Order placed successfully!');
                clearCart();
                cartModal.hide();
                window.location.href = 'CustomerDashboard.html#orders';
            } else {
                alert(result.message || 'Failed to place order.');
            }
        }
    </script>
</body>

</html>
