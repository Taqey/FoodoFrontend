<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Foodo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="shortcut icon" href="icons/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800,900" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/ionicons/4.5.6/css/ionicons.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            background: #f8f9fa;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header img {
            height: 60px;
            margin-bottom: 15px;
        }

        .login-header h3 {
            font-weight: 700;
            color: #333;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #eee;
            background: #fcfcfc;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #ffc107;
            /* Foodo yellow/orange assumption */
        }

        .btn-primary {
            background: #ffc107;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            color: #333;
            width: 100%;
            margin-top: 20px;
        }

        .btn-primary:hover {
            background: #e0a800;
            color: #333;
        }

        .forgot-pass {
            text-align: right;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .forgot-pass a {
            color: #666;
            text-decoration: none;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
        }

        .register-link a {
            color: #333;
            font-weight: 600;
            text-decoration: none;
        }

        .alert {
            display: none;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="login-header">
            <img src="icons/Logo.png" alt="Foodo Logo">
            <h3>Welcome Back</h3>
            <p class="text-muted">Please login to your account</p>
        </div>

        <div class="alert alert-danger" id="error-alert"></div>

        <form id="login-form">
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" required placeholder="Enter your email">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required placeholder="Enter your password">
            </div>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Remember me</label>
                </div>
                <div class="forgot-pass">
                    <a href="ForgotPassword.html">Forgot Password?</a>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>

        <div class="register-link">
            Don't have an account? <a href="Register.html">Sign Up</a>
        </div>
    </div>

    <script src="js/Authentication.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const errorAlert = document.getElementById('error-alert');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            // Reset error
            errorAlert.style.display = 'none';
            errorAlert.textContent = '';

            // Loading state
            submitBtn.disabled = true;
            submitBtn.textContent = 'Logging in...';

            const result = await Authentication.login(email, password, rememberMe);

            if (result.success) {
                // Redirect based on role
                if (result.role === 'Merchant') {
                    window.location.href = 'MerchantDashboard.html';
                } else {
                    window.location.href = 'Main.html';
                }
            } else {
                errorAlert.textContent = result.message || 'Invalid email or password';
                errorAlert.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Login';
            }
        });
    </script>
</body>

</html>
