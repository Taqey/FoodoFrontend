<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Categories - Foodo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="shortcut icon" href="icons/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800,900" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            background: #f8f9fa;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .categories-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 900px;
        }

        .category-item {
            border: 1px solid #eee;
            border-radius: 50px;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-block;
            user-select: none;
        }

        .category-item:hover {
            background: #f0f0f0;
        }

        .category-item.selected {
            background: #ffc107;
            color: #333;
            border-color: #ffc107;
            font-weight: 600;
        }

        .category-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 30px 0;
        }
    </style>
</head>

<body>

    <div class="categories-card">
        <h3 class="text-center mb-2">What do you serve?</h3>
        <p class="text-center text-muted mb-4">Select all categories that apply to your restaurant</p>

        <div class="category-grid" id="category-container">
            <!-- Categories will be injected here -->
        </div>

        <div class="alert alert-danger" id="error-alert" style="display:none;"></div>

        <div class="text-center">
            <button class="btn btn-primary btn-lg px-5" id="submit-btn" onclick="submitCategories()">Finish
                Setup</button>
        </div>
    </div>
    <script src="js/config.js"></script>

    <script src="js/Authentication.js"></script>
    <script>
        const categories = [
            "FastFood", "CasualDining", "FineDining", "Cafe", "Bakery",
            "DessertShop", "JuiceBar", "Seafood", "Steakhouse", "Pizzeria",
            "BBQ", "FamilyRestaurant", "HealthyFood", "Vegetarian", "Vegan",
            "FoodTruck", "Buffet", "Sandwiches", "Egyptian", "Italian",
            "American", "Mexican", "Turkish", "Chinese", "Japanese",
            "Indian", "Lebanese", "Syrian", "Greek", "French"
        ];

        const container = document.getElementById('category-container');
        const selectedCategories = new Set();

        // Render categories
        categories.forEach(cat => {
            const el = document.createElement('div');
            el.className = 'category-item';
            // Add spaces before capital letters for display
            el.textContent = cat.replace(/([A-Z])/g, ' $1').trim();
            el.dataset.value = cat;

            el.onclick = () => {
                if (selectedCategories.has(cat)) {
                    selectedCategories.delete(cat);
                    el.classList.remove('selected');
                } else {
                    selectedCategories.add(cat);
                    el.classList.add('selected');
                }
            };

            container.appendChild(el);
        });

        async function submitCategories() {
            const userId = sessionStorage.getItem('tempUserId');
            if (!userId) {
                alert('User ID missing. Please register again.');
                window.location.href = 'Register.html';
                return;
            }

            if (selectedCategories.size === 0) {
                alert('Please select at least one category.');
                return;
            }

            const btn = document.getElementById('submit-btn');
            const errorAlert = document.getElementById('error-alert');

            btn.disabled = true;
            btn.textContent = 'Saving...';
            errorAlert.style.display = 'none';

            const categoriesStr = Array.from(selectedCategories).join(',');

            const result = await Authentication.addCategory(userId, categoriesStr);

            if (result.success) {
                // Keep temp ID for restaurant image upload
                // sessionStorage tempUserId will be used in RestaurantImage.html
                window.location.href = 'RestaurantImage.html';
            } else {
                errorAlert.textContent = result.message || 'Failed to save categories';
                errorAlert.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Finish Setup';
            }
        }
    </script>
</body>

</html>
