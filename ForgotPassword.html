<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Foodo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="shortcut icon" href="icons/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800,900" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            background: #f8f9fa;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }

        .step-section {
            display: none;
            animation: fadeIn 0.5s;
        }

        .step-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .timer {
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffc107;
            text-align: center;
            margin: 15px 0;
        }
    </style>
</head>

<body>

    <div class="auth-card">
        <h3 class="text-center mb-4">Reset Password</h3>

        <div class="alert alert-danger" id="error-alert" style="display:none;"></div>

        <!-- Step 1: Request Code -->
        <div class="step-section active" id="step1">
            <p class="text-muted text-center">Enter your email address to receive a verification code.</p>
            <form id="request-form">
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Send Code</button>
            </form>
            <div class="text-center mt-3">
                <a href="Login.html" class="text-decoration-none text-secondary">Back to Login</a>
            </div>
        </div>

        <!-- Step 2: Verify & Reset -->
        <div class="step-section" id="step2">
            <p class="text-muted text-center">Enter the code sent to your email and your new password.</p>

            <div class="timer" id="timer">10:00</div>

            <form id="reset-form">
                <div class="mb-3">
                    <label class="form-label">Verification Code</label>
                    <input type="text" class="form-control" id="code" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input type="password" class="form-control" id="new-password" required
                        pattern="^(?=.*\d)(?=.*[A-Z])(?=.*[a-z])(?=.*[^\w\d\s:])([^\s]){8,16}$"
                        title="Must be 8-16 chars, 1 uppercase, 1 lowercase, 1 number, 1 special char">
                </div>
                <button type="submit" class="btn btn-primary w-100">Reset Password</button>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/Authentication.js"></script>
    <script>
        let timerInterval;

        function startTimer(duration, display) {
            let timer = duration, minutes, seconds;
            timerInterval = setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                display.textContent = minutes + ":" + seconds;

                if (--timer < 0) {
                    clearInterval(timerInterval);
                    display.textContent = "EXPIRED";
                    document.querySelector('#reset-form button').disabled = true;
                    alert('Code expired. Please request a new one.');
                    location.reload();
                }
            }, 1000);
        }

        document.getElementById('request-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const errorAlert = document.getElementById('error-alert');

            errorAlert.style.display = 'none';

            const result = await Authentication.submitForgetPasswordRequest(email);

            if (result.success) {
                document.getElementById('step1').classList.remove('active');
                document.getElementById('step2').classList.add('active');
                startTimer(600, document.getElementById('timer')); // 10 minutes
            } else {
                errorAlert.textContent = result.message || 'Failed to send code';
                errorAlert.style.display = 'block';
            }
        });

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = document.getElementById('code').value;
            const password = document.getElementById('new-password').value;
            const errorAlert = document.getElementById('error-alert');

            errorAlert.style.display = 'none';

            const result = await Authentication.resetPassword(code, password);

            if (result.success) {
                clearInterval(timerInterval);
                alert('Password reset successful! Please login.');
                window.location.href = 'Login.html';
            } else {
                errorAlert.textContent = result.message || 'Failed to reset password';
                errorAlert.style.display = 'block';
            }
        });
    </script>
</body>

</html>
