<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Foodo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="shortcut icon" href="icons/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800,900" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            background: #f8f9fa;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .step {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #eee;
            color: #999;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            margin: 0 10px;
            position: relative;
        }

        .step.active {
            background: #ffc107;
            color: #333;
        }

        .step.completed {
            background: #28a745;
            color: white;
        }

        .step::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 2px;
            background: #eee;
            right: -20px;
            top: 50%;
            transform: translateY(-50%);
        }

        .step:last-child::after {
            display: none;
        }

        .role-card {
            border: 2px solid #eee;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .role-card:hover,
        .role-card.selected {
            border-color: #ffc107;
            background: #fff9e6;
        }

        .role-card img {
            width: 60px;
            margin-bottom: 15px;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn-nav {
            min-width: 120px;
        }
    </style>
</head>

<body>

    <div class="register-card">
        <h3 class="text-center mb-4">Create Account</h3>

        <div class="step-indicator">
            <div class="step active" id="step1-ind">1</div>
            <div class="step" id="step2-ind">2</div>
        </div>

        <form id="register-form">
            <!-- Step 1: Account Info & Role -->
            <div class="form-section active" id="step1">
                <h5 class="mb-3">Choose Account Type</h5>
                <div class="row mb-4">
                    <div class="col-md-6 mb-3">
                        <div class="role-card selected" onclick="selectRole('Customer')">
                            <!-- Placeholder icon -->
                            <h5>Customer</h5>
                            <p class="text-muted small mb-0">Order food from your favorite restaurants</p>
                            <input type="radio" name="role" value="Customer" checked style="display:none;">
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <div class="role-card" onclick="selectRole('Merchant')">
                            <!-- Placeholder icon -->
                            <h5>Merchant</h5>
                            <p class="text-muted small mb-0">Register your restaurant and sell food</p>
                            <input type="radio" name="role" value="Merchant" style="display:none;">
                        </div>
                    </div>
                </div>

                <h5 class="mb-3">Account Details</h5>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" name="UserName" required minlength="3" maxlength="30">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="Email" required>
                    </div>
                    <div class="col-md-12 mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="Password" required
                            pattern="^(?=.*\d)(?=.*[A-Z])(?=.*[a-z])(?=.*[^\w\d\s:])([^\s]){8,16}$"
                            title="Must be 8-16 chars, 1 uppercase, 1 lowercase, 1 number, 1 special char">
                        <div class="form-text">8-16 chars, uppercase, lowercase, number, special char.</div>
                    </div>
                </div>

                <div class="d-flex justify-content-end">
                    <button type="button" class="btn btn-primary btn-nav" onclick="nextStep()">Next</button>
                </div>
            </div>

            <!-- Step 2: Profile Details -->
            <div class="form-section" id="step2">
                <h5 class="mb-3" id="step2-title">Personal Details</h5>

                <!-- Customer Fields -->
                <div id="customer-fields">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control customer-req" name="FirstName">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control customer-req" name="LastName">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Phone Number</label>
                            <input type="tel" class="form-control customer-req" name="PhoneNumber">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Date of Birth</label>
                            <input type="date" class="form-control customer-req" name="DateOfBirth">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Gender</label>
                            <select class="form-select customer-req" name="Gender">
                                <option value="0">Male</option>
                                <option value="1">Female</option>
                            </select>
                        </div>
                    </div>
                    <h6 class="mt-3 mb-3">Address</h6>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Country</label>
                            <input type="text" class="form-control" name="Country">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">State</label>
                            <input type="text" class="form-control" name="State">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">City</label>
                            <input type="text" class="form-control" name="City">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Postal Code</label>
                            <input type="text" class="form-control" name="PostalCode" pattern="\d{4,10}">
                        </div>
                        <div class="col-md-12 mb-3">
                            <label class="form-label">Street Address</label>
                            <input type="text" class="form-control" name="StreetAddress">
                        </div>
                    </div>
                </div>

                <!-- Merchant Fields -->
                <div id="merchant-fields" style="display:none;">
                    <div class="mb-3">
                        <label class="form-label">Store Name</label>
                        <input type="text" class="form-control merchant-req" name="StoreName">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Store Description</label>
                        <textarea class="form-control merchant-req" name="StoreDescription" rows="3"></textarea>
                    </div>
                </div>

                <div class="alert alert-danger mt-3" id="error-alert" style="display:none;"></div>

                <div class="d-flex justify-content-between mt-4">
                    <button type="button" class="btn btn-secondary btn-nav" onclick="prevStep()">Back</button>
                    <button type="submit" class="btn btn-success btn-nav">Register</button>
                </div>
            </div>
        </form>

        <div class="text-center mt-3">
            Already have an account? <a href="Login.html">Login</a>
        </div>
    </div>

    <script src="js/Authentication.js"></script>
    <script>
        let currentRole = 'Customer';

        function selectRole(role) {
            currentRole = role;
            document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
            document.querySelector(`input[value="${role}"]`).parentElement.classList.add('selected');
            document.querySelector(`input[value="${role}"]`).checked = true;
        }

        function nextStep() {
            // Validate Step 1
            const step1Inputs = document.querySelectorAll('#step1 input');
            let valid = true;
            step1Inputs.forEach(input => {
                if (!input.checkValidity()) {
                    input.reportValidity();
                    valid = false;
                }
            });
            if (!valid) return;

            // Switch UI
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
            document.getElementById('step1-ind').classList.remove('active');
            document.getElementById('step1-ind').classList.add('completed');
            document.getElementById('step2-ind').classList.add('active');

            // Toggle Fields
            if (currentRole === 'Customer') {
                document.getElementById('customer-fields').style.display = 'block';
                document.getElementById('merchant-fields').style.display = 'none';
                document.getElementById('step2-title').textContent = 'Personal Details';

                // Set required
                document.querySelectorAll('.customer-req').forEach(i => i.required = true);
                document.querySelectorAll('.merchant-req').forEach(i => i.required = false);
            } else {
                document.getElementById('customer-fields').style.display = 'none';
                document.getElementById('merchant-fields').style.display = 'block';
                document.getElementById('step2-title').textContent = 'Store Details';

                // Set required
                document.querySelectorAll('.customer-req').forEach(i => i.required = false);
                document.querySelectorAll('.merchant-req').forEach(i => i.required = true);
            }
        }

        function prevStep() {
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step1').classList.add('active');
            document.getElementById('step2-ind').classList.remove('active');
            document.getElementById('step1-ind').classList.remove('completed');
            document.getElementById('step1-ind').classList.add('active');
        }

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            const errorAlert = document.getElementById('error-alert');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            errorAlert.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Registering...';

            let result;
            if (currentRole === 'Customer') {
                result = await Authentication.registerCustomer(data);
                if (result.success) {
                    alert('Registration successful! Please login.');
                    window.location.href = 'Login.html';
                }
            } else {
                result = await Authentication.registerMerchant(data);
                if (result.success) {
                    // Redirect to Categories page
                    // Pass userId if needed? 
                    // The add-category endpoint needs UserId. 
                    // registerMerchant returns result.Data which might contain the User object or ID.
                    // Let's assume result.data.id or similar.
                    // I'll save it to sessionStorage to pass to next page

                    // Inspecting backend Register method return:
                    // It returns Ok(result.Data). 
                    // I need to know what result.Data is. 
                    // Usually it's the User object.
                    // I'll assume it has an Id.

                    if (result.data && result.data.id) {
                        sessionStorage.setItem('tempUserId', result.data.id);
                        window.location.href = 'Categories.html';
                    } else {
                        // Fallback if ID not found, maybe login first?
                        alert('Registration successful! Please login to setup your store.');
                        window.location.href = 'Login.html';
                    }
                }
            }

            if (!result.success) {
                errorAlert.textContent = result.message || 'Registration failed';
                errorAlert.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Register';
            }
        });
    </script>
</body>

</html>
